    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="first-view">
      <div class="scroll-infinity">
        <div class="scroll-infinity_wrap">
          <ul class="scroll-infinity_list scroll-infinity_list--left">

            <li class="scroll-infinity_item">
              <img src="img/thumbnail-03.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-04.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-05.webp" />
            </li>
          </ul>
          <ul class="scroll-infinity_list scroll-infinity_list--left">
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-01.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-02.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-03.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-04.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-05.webp" />
            </li>
          </ul>
          <ul class="scroll-infinity_list scroll-infinity_list--left">
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-01.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-02.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-03.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-04.webp" />
            </li>
            <li class="scroll-infinity_item">
              <img src="img/thumbnail-05.webp" />
            </li>
          </ul>
        </div>
      </div>
      <div class="first-view_text">
        <p>中学生・高校生 / 応募無料 / 11月30日締切</p>
        <h1>
          さあ、きみの手で<br />
          地域の課題を解決せよ。
        </h1>
        <div class="scroll-down">
          <img src="img/scroll-down.webp" alt="" />
        </div>
      </div>
    </section>
    <section class="recruit">
      <div class="recruit-category">
        <h2>募集部門</h2>
        <div class="category-list">
          <div class="category-item">
            <span class="category-number">01</span>
            <h3>魅力発信</h3>
            <p>地域の人やお店、風景を知ってもらうための作品。</p>
          </div>
          <div class="category-item">
            <span class="category-number">02</span>
            <h3>防災安全</h3>
            <p>災害や日々の危険から身を守るための作品。</p>
          </div>
          <div class="category-item">
            <span class="category-number">03</span>
            <h3>環境</h3>
            <p>ごみや自然環境の課題に取り組む作品。</p>
          </div>
        </div>
      </div>
      <div class="recruit-detail">
        <h2>募集要項</h2>
        　
        <dl class="recruit-table">
          <div class="recruit-row">
            <dt>応募期間</dt>
            <dd>2026年9月1日 — 11月30日</dd>
          </div>
          <div class="recruit-row">
            <dt>応募資格</dt>
            <dd>中学生・高校生</dd>
          </div>
          <div class="recruit-row">
            <dt>応募料</dt>
            <dd>無料</dd>
          </div>
          <div class="recruit-row">
            <dt>審査発表</dt>
            <dd>2026年12月20日</dd>
          </div>
          　
        </dl>
      </div>
    </section>
